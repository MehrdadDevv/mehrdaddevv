<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0d0d"/>
      <stop offset="1" stop-color="#171411"/>
    </linearGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#fb923c"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="320" rx="18" fill="url(#bg)" stroke="#f59e0b" stroke-opacity="0.25"/>
  <!-- speedometer -->
  <g transform="translate(930,160)">
    <circle r="120" fill="none" stroke="#2a2a2a" stroke-width="14"/>
    <circle r="120" fill="none" stroke="url(#arc)" stroke-width="14" stroke-linecap="round"
      stroke-dasharray="565 754" transform="rotate(-225)"/>
    <line x1="0" y1="0" x2="0" y2="-92" stroke="#f5f1e8" stroke-width="4" stroke-linecap="round" transform="rotate(42)"/>
    <circle r="8" fill="#f5f1e8"/>
    <text y="58" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" font-size="16" fill="#8a8a8a">RPM × 1000</text>
    <text y="-30" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#f59e0b">ONLINE</text>
  </g>
  <text x="70" y="120" font-family="JetBrains Mono, Consolas, monospace" font-size="18" fill="#f59e0b" letter-spacing="4">// DEVELOPER · GARAGE OPEN</text>
  <text x="66" y="208" font-family="Inter, Helvetica, Arial, sans-serif" font-size="96" font-weight="800" fill="#f5f1e8" letter-spacing="2">MEHRDAD</text>
  <text x="70" y="250" font-family="Vazirmatn, Tahoma, sans-serif" font-size="26" fill="#d6d3cc">توسعه‌دهنده‌ی وب · ساخت ابزار برای کاربران فارسی‌زبان</text>
  <text x="70" y="284" font-family="JetBrains Mono, Consolas, monospace" font-size="15" fill="#8a8a8a">Django · JavaScript · Persian RTL · built piece by piece</text>
</svg>
